# 私有化部署参考编排。ROADMAP 阶段 G。
#
# 这份文件是**可运行的最小生产形态**，不是「开发用 compose」：平台库是 PostgreSQL
# 而不是 SQLite，因为 SQLite 串行化写入，多工作进程下表现为间歇性超时而不是
# 明显的配置错误（`aletheia preflight` 会拦下这个组合）。
#
# 使用：
#   cp deploy/.env.example deploy/.env   然后填入真实值
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# 启动时 `aletheia serve` 会自动跑部署前自检并在有阻断项时拒绝启动。

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ontology}
      POSTGRES_USER: ${POSTGRES_USER:-ontology}
      # 无默认值：留空会让 compose 报错，而不是静默启一个空口令数据库。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 不对外映射端口：平台通过 compose 网络访问它。
    # 暴露 5432 会让数据库直接可达，而平台库保存全部数据源连接串。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ontology} -d ${POSTGRES_DB:-ontology}"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ONTOLOGY_PLATFORM_DB_TYPE: postgresql
      ONTOLOGY_PLATFORM_DB_URI: >-
        postgresql://${POSTGRES_USER:-ontology}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ontology}
      # 显式设置：未设置时首次启动会生成随机口令并只打印一次，
      # 而容器日志轮转后那一行通常已经没了。
      ONTOLOGY_ADMIN_PASSWORD: ${ONTOLOGY_ADMIN_PASSWORD:?必须设置 ONTOLOGY_ADMIN_PASSWORD}
      # 逐个列出真实前端来源。`*` 会被 preflight 拦下。
      ONTOLOGY_ALLOWED_ORIGINS: ${ONTOLOGY_ALLOWED_ORIGINS:?必须设置 ONTOLOGY_ALLOWED_ORIGINS}
      ONTOLOGY_SESSION_TTL_HOURS: ${ONTOLOGY_SESSION_TTL_HOURS:-12}
    volumes:
      # 平台库在 PostgreSQL 里，这个卷用于文档上传等本地状态。
      - platform-state:/var/lib/aletheia
    ports:
      - "${ONTOLOGY_BIND:-127.0.0.1}:8000:8000"

  # 部署前自检作为一次性任务：在 CI 或发布流程里先跑它，
  # 阻断项存在时退出码非 0，从而在服务启动之前停下。
  preflight:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["check"]
    environment:
      ONTOLOGY_PLATFORM_DB_TYPE: postgresql
      ONTOLOGY_PLATFORM_DB_URI: >-
        postgresql://${POSTGRES_USER:-ontology}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ontology}
      ONTOLOGY_ADMIN_PASSWORD: ${ONTOLOGY_ADMIN_PASSWORD}
      ONTOLOGY_ALLOWED_ORIGINS: ${ONTOLOGY_ALLOWED_ORIGINS}
    command: ["preflight", "--environment", "production", "--workers", "1"]

volumes:
  db-data:
  platform-state:

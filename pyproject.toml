# The distribution is a single installable package. The split into
# aletheia-core / -web / -admin (ADR-0001) stays deferred: it depends on the SPI shapes,
# which need a second real use case before they can be frozen (ROADMAP stage D). What
# is *not* deferred is being installable at all -- a framework nobody can `pip install`
# is a repository, not a framework.
#
# Optional extras carry the split's eventual seams without pre-committing to them: a
# user who only wants the kernel installs no web server, and can migrate to
# `aletheia-core` later without changing their imports.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-onto"
version = "0.5.0"
description = "为传统业务系统安装可核验的业务语义内核：本体、语义映射、规则推理与决策留痕"
readme = "README.md"
# 3.11 rather than 3.9: 3.9 reached end of life in October 2025, and the current
# releases of FastAPI, psycopg, pytest and mypy all require 3.10+. Holding the old
# floor meant every dependency update had to be refused, which is how a project
# accumulates known vulnerabilities while its CI stays green. 3.11 is supported
# until October 2027, so it is the oldest floor that does not expire during the
# lifetime of a deployment installed today.
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ontology", "semantic", "business-rules", "knowledge-graph", "legacy-modernization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The kernel's own dependencies. Deliberately empty of a web framework: the ontology,
# rule engine and decision records work without one, and a library that drags in a
# server cannot be embedded in someone else's application.
dependencies = []

[project.optional-dependencies]
# Pinned rather than ranged. A range on a rule-engine dependency means a transitive
# upgrade can change a verdict, and a verdict is what this platform is accountable for.
web = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # Declared rather than inherited: `api.py` uses File()/Form(), and FastAPI moved
    # the multipart parser out of its base install into `fastapi[standard]`. Relying on
    # the transitive copy means a FastAPI upgrade turns document upload into a 500 at
    # request time, not an install-time error.
    "python-multipart==0.0.32",
]
postgresql = ["psycopg[binary]==3.3.5"]
mysql = ["PyMySQL==1.2.0"]
# Document ingestion for the knowledge layer.
documents = ["python-docx==1.2.0"]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
    # Only `fastapi.testclient` needs an HTTP client; the platform's own outbound calls
    # (REST data sources, model endpoints) use `urllib` so the kernel stays dependency
    # free. It sat in `web` until 3.11, which made every deployment install a client it
    # never imports.
    "httpx==0.28.1",
    # Verifies that exported OWL/SHACL/Turtle actually parses. A test dependency rather
    # than a runtime one: the platform *writes* RDF and never reads it, and the kernel
    # stays dependency-free. Not optional in CI though -- asserting that an export
    # "contains" a substring is how a syntactically invalid Turtle document shipped
    # unnoticed, since an invalid document contains substrings just as well as a valid one.
    "rdflib==7.6.0",
]
# Everything, for a deployment that does not want to reason about extras.
all = [
    "aletheia-onto[web]",
    "aletheia-onto[postgresql]",
    "aletheia-onto[mysql]",
    "aletheia-onto[documents]",
]

[project.scripts]
aletheia = "ontology_platform.cli:main"

[project.urls]
Homepage = "https://github.com/S0ra-ai/Aletheia-onto"
Documentation = "https://github.com/S0ra-ai/Aletheia-onto/blob/main/README.md"
Changelog = "https://github.com/S0ra-ai/Aletheia-onto/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["ontology_platform*"]

[tool.setuptools.package-data]
# PEP 561: without this marker a consumer's type checker silently ignores our
# annotations, so a wrong call site looks fine until runtime.
#
# The scaffold templates ship too, or `aletheia new` would work from a checkout and fail on
# an installed wheel -- which is the only environment a user actually has.
ontology_platform = ["py.typed", "scaffold_templates/*.tpl", "scaffold_templates/extensions/*.tpl"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", ".venv", "examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # FastAPI's Depends()/File()/Form() in defaults is the framework's own idiom.
    "B008",
    # Nested `with` blocks are clearer than a combined one when the second
    # context depends on the first.
    "SIM117",
    # Line length is enforced by the formatter, not the linter.
    "E501",
    # A two-branch if/else that carries an explanatory comment reads better than
    # a packed ternary; several of ours document a driver quirk.
    "SIM108",
    # This codebase is written in Chinese: full-width punctuation inside strings
    # is correct, not an ambiguous-character mistake.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The package facade groups its exports by concern (onboarding, ontology lifecycle,
# assessment, expressiveness, extension points) with a comment per group. That grouping
# is how a newcomer finds the right entry point; alphabetical order would scatter it.
"backend/ontology_platform/__init__.py" = ["RUF022"]
# Tests and scripts insert backend/ into sys.path before importing the package,
# so imports legitimately follow executable statements.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["backend/ontology_platform"]
# Deliberately permissive to start: the goal is to catch outright type errors
# without blocking the branch on annotating 12k lines. Tighten incrementally
# as part of ROADMAP stage C.
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = false
exclude = ["frontend", "examples", "\\.venv"]
